<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开发文档离线包</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --txt:#e8eaf0; --sub:#9aa3b2; --accent:#58a6ff; --border:#2a2f3a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;line-height:1.6;padding:48px 16px 60px}
  .wrap{max-width:820px;margin:0 auto}
  header{margin-bottom:24px}
  h1{font-size:1.5rem;margin-bottom:6px}
  .meta{color:var(--sub);font-size:.85rem}
  .note{color:var(--sub);font-size:.8rem;background:var(--card);border:1px dashed var(--border);border-radius:8px;padding:8px 12px;margin:12px 0}
  a.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;text-decoration:none;color:var(--txt);margin-bottom:8px;transition:border-color .12s,transform .12s}
  a.item:hover{border-color:var(--accent);transform:translateX(3px)}
  a.item .t{font-weight:600;color:var(--accent)}
  a.item .d{color:var(--sub);font-size:.82rem}
  a.item .dt{color:var(--sub);font-size:.75rem;white-space:nowrap;flex-shrink:0;margin-left:12px}
  footer{margin-top:40px;color:var(--sub);font-size:.75rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 开发文档离线包</h1>
    <div class="meta">Claude Code · OpenAI Codex · DeepSeek Harness 官方文档镜像 · 每天 08:17（北京时间）自动更新</div>
  </header>

  <!-- DOCS:BEGIN -->
  <!-- DOCS:END -->

  <footer>由 GitHub Actions 自动构建 · 文档版权归各自官方所有，仅供个人学习参考</footer>
</div>
</body>
</html>
