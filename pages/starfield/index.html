<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05070c" />
<title>WARP // starfield</title>
<style>
  :root {
    --bg: #05070c;
    --ink: #58a6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    overscroll-behavior: none;
    color: var(--ink);
    font-family: "JetBrains Mono", "SFMono-Regular", "DejaVu Sans Mono",
                 "Consolas", "Menlo", monospace;
    -webkit-tap-highlight-color: transparent;
  }
  #scene {
    position: fixed; inset: 0;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #scene:active { cursor: grabbing; }

  /* static overlays (never accumulate with the canvas trails) */
  .layer { position: fixed; inset: 0; pointer-events: none; }

  #nebula {
    background:
      radial-gradient(34% 44% at 47% 50%,
        rgba(27, 58, 107, 0.40) 0%,
        rgba(27, 58, 107, 0.20) 22%,
        rgba(27, 58, 107, 0.08) 45%,
        rgba(20, 40, 80, 0.02) 68%,
        rgba(0,0,0,0) 88%),
      radial-gradient(30% 40% at 60% 46%,
        rgba(74, 43, 107, 0.32) 0%,
        rgba(74, 43, 107, 0.16) 24%,
        rgba(60, 36, 90, 0.06) 50%,
        rgba(0,0,0,0) 82%),
      radial-gradient(20% 26% at 42% 62%,
        rgba(120, 200, 220, 0.10) 0%,
        rgba(0,0,0,0) 74%);
    mix-blend-mode: screen;
    animation: drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%   { transform: translate3d(-1.6%, -1.2%, 0) scale(1.03); }
    100% { transform: translate3d(1.6%, 1.4%, 0) scale(1.10); }
  }
  #vignette {
    background: radial-gradient(120% 120% at 50% 50%,
      rgba(0,0,0,0) 44%,
      rgba(0,0,0,0.55) 76%,
      rgba(0,0,0,0.92) 100%);
  }

  /* ---- HUD ---- */
  #hud {
    position: fixed;
    right: 14px;
    bottom: calc(14px + env(safe-area-inset-bottom));
    padding: 6px 8px 6px 8px;
    padding-bottom: calc(6px + env(safe-area-inset-bottom));
    z-index: 10;
    font-size: 12px;
    line-height: 1.6;
    letter-spacing: 0.06em;
    text-align: right;
    color: var(--ink);
    text-shadow: 0 0 6px rgba(88,166,255,0.55), 0 0 14px rgba(88,166,255,0.25);
    user-select: none;
    padding: 6px 8px;
    overflow: hidden;
    transition: opacity 0.35s ease;
  }
  /* scanline texture on the HUD */
  #hud::after {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg, rgba(88,166,255,0.10) 0px, rgba(88,166,255,0.10) 1px,
      transparent 1px, transparent 3px);
    pointer-events: none;
    mix-blend-mode: screen;
  }
  #hud.hidden { opacity: 0; }
  #hud .row { white-space: nowrap; position: relative; z-index: 1; }
  #hud .k { color: rgba(88,166,255,0.55); }
  #hud .v { color: rgba(198, 226, 255, 0.98); }
  #hud .warp { color: #fff4d6; text-shadow: 0 0 8px rgba(255,244,214,0.6); }
  #hud .title {
    font-size: 10px;
    letter-spacing: 0.34em;
    color: rgba(88,166,255,0.5);
    margin-bottom: 3px;
    position: relative; z-index: 1;
  }

  #hint {
    position: fixed;
    left: 14px;
    bottom: calc(12px + env(safe-area-inset-bottom));
    z-index: 10;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: rgba(88,166,255,0.42);
    text-shadow: 0 0 6px rgba(88,166,255,0.3);
    user-select: none;
    transition: opacity 0.6s ease;
  }
  #hint.hidden { opacity: 0; }

  /* mobile-first tweaks */
  @media (max-width: 620px) {
    #hud { font-size: 11px; right: 10px; padding: 5px 6px; }
    #hud .title { font-size: 9px; letter-spacing: 0.28em; }
    #hint { font-size: 9px; left: 10px; letter-spacing: 0.08em; }
  }
  @media (max-width: 480px) {
    #hud { font-size: 10px; right: 8px; }
    #hint { font-size: 8px; left: 8px; }
  }
  @media (max-width: 360px) {
    #hud { font-size: 9px; }
    #hint { font-size: 7px; }
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="nebula" class="layer"></div>
  <div id="vignette" class="layer"></div>

  <div id="hud">
    <div class="title">WARP&nbsp;DRIVE</div>
    <div class="row"><span class="k">FPS </span><span class="v" id="fps">--</span></div>
    <div class="row"><span class="k">STAR </span><span class="v" id="stars">--</span></div>
    <div class="row"><span class="k">WARP </span><span class="v warp" id="warp">x1.0</span></div>
  </div>
  <div id="hint">DRAG&nbsp;·&nbsp;HOLD&nbsp;SPACE/LONG-PRESS/SCROLL&nbsp;=&&nbsp;WARP&nbsp;·&nbsp;R&nbsp;RESET</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("scene");
  var ctx = canvas.getContext("2d", { alpha: false });

  var elFps = document.getElementById("fps");
  var elStars = document.getElementById("stars");
  var elWarp = document.getElementById("warp");
  var elHud = document.getElementById("hud");
  var elHint = document.getElementById("hint");

  // ---- config ----
  var Z_MAX = 1.35;
  var Z_NEAR = 0.045;
  var BASE_SPEED = 0.17;     // cruise forward speed (z units/sec)
  var WARP_MAX = 5.0;        // warp multiplier ceiling
  var CRUISE = 1.0;
  var DUST_SPEED = 0.12;     // background dust fraction of star speed
  var STAR_CAP = 3500;       // hard particle cap
  var DUST_CAP = 130;

  // depth layers: far / mid / near  (size, brightness, z-range, trail factor)
  var LAYERS = [
    { size: 0.55, bright: 0.55, z0: 0.55, z1: Z_MAX,   trail: 0.55, glow: 0.0 }, // far
    { size: 1.05, bright: 0.82, z0: 0.20, z1: 1.00,   trail: 0.90, glow: 0.4 }, // mid
    { size: 2.10, bright: 1.00, z0: Z_NEAR, z1: 0.55, trail: 1.35, glow: 1.0 }  // near
  ];
  var LAYER_PICK = [0.45, 0.40, 0.15]; // distribution far/mid/near

  // ---- state ----
  var W = 0, H = 0, CX = 0, CY = 0, FOCAL = 0, DPR = 1;
  var stars = [], dust = [];
  var starCount = 0, dustCount = 0;

  var camX = 0, camY = 0, camTX = 0, camTY = 0;

  var warp = CRUISE, warpTarget = CRUISE, warpBoost = 0, spaceDown = false;

  var lastT = 0, running = true, rafId = 0;

  var fpsSmooth = 60, fpsAccum = 0, fpsFrames = 0, fpsShown = 60;
  var hudTimer = 0;

  var reduceMotion = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rand(a, b) { return a + Math.random() * (b - a); }

  // ---- glow sprites (pre-rendered, cheap additive glow) ----
  function makeGlow(size, r, g, b) {
    var c = document.createElement("canvas");
    c.width = c.height = size;
    var g2 = c.getContext("2d");
    var h = size / 2;
    var grd = g2.createRadialGradient(h, h, 0, h, h, h);
    grd.addColorStop(0.0, "rgba(255,255,255,1)");
    grd.addColorStop(0.22, "rgba(" + r + "," + g + "," + b + ",0.95)");
    grd.addColorStop(0.55, "rgba(" + r + "," + g + "," + b + ",0.35)");
    grd.addColorStop(1.0, "rgba(" + r + "," + g + "," + b + ",0)");
    g2.fillStyle = grd;
    g2.fillRect(0, 0, size, size);
    return c;
  }
  var glowCool = makeGlow(48, 150, 190, 255);
  var glowWarm = makeGlow(48, 255, 240, 210);

  // ---- sizing ----
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    CX = W * 0.5;
    CY = H * 0.5;
    FOCAL = Math.min(W, H) * 0.92;

    var area = W * H;
    starCount = Math.round(clamp(area / 380, 700, STAR_CAP));
    dustCount = Math.round(clamp(area / 22000, 36, DUST_CAP));

    seedStars();
    seedDust();
    paintBase();
  }

  function paintBase() {
    ctx.fillStyle = "#05070c";
    ctx.fillRect(0, 0, W, H);
  }

  // ---- stars ----
  function pickLayer() {
    var r = Math.random();
    if (r < LAYER_PICK[0]) return 0;
    if (r < LAYER_PICK[0] + LAYER_PICK[1]) return 1;
    return 2;
  }
  function newStar(spawnFar) {
    var L = pickLayer();
    var lay = LAYERS[L];
    var hr = Math.random(), hue = 0;
    if (hr < 0.15) hue = 1;        // ~15% cool blue
    else if (hr < 0.23) hue = 2;   // ~8% warm
    return {
      x: rand(-1.3, 1.3),
      y: rand(-1.3, 1.3),
      z: spawnFar ? lay.z1 : rand(lay.z0 + 0.02, lay.z1),
      layer: L,
      hue: hue
    };
  }
  function seedStars() {
    stars = new Array(starCount);
    for (var i = 0; i < starCount; i++) stars[i] = newStar(false);
  }

  // ---- dust ----
  function newDust(spawnFar) {
    return {
      x: rand(-2.6, 2.6),
      y: rand(-2.6, 2.6),
      z: spawnFar ? Z_MAX * 1.8 : rand(Z_MAX * 0.6, Z_MAX * 1.8),
      vx: rand(-0.014, 0.014),
      vy: rand(-0.014, 0.014),
      seed: Math.random()
    };
  }
  function seedDust() {
    dust = new Array(dustCount);
    for (var i = 0; i < dustCount; i++) dust[i] = newDust(false);
  }

  function projX(x, z) { return CX + (x - camX) * (FOCAL / z); }
  function projY(y, z) { return CY + (y - camY) * (FOCAL / z); }

  // ---- color ----
  function starRGB(prox, spd, bright, hue, out) {
    var r, g, b;
    if (prox < 0.5) {
      var t = prox / 0.5;
      r = lerp(150, 255, t); g = lerp(190, 255, t); b = 255;
    } else {
      var t2 = (prox - 0.5) / 0.5;
      r = 255; g = lerp(255, 244, t2); b = lerp(255, 214, t2);
    }
    // hue tint: cool blue / warm amber / white
    if (hue === 1) { r = lerp(r, 138, 0.55); g = lerp(g, 180, 0.55); b = lerp(b, 255, 0.45); }
    else if (hue === 2) { r = lerp(r, 255, 0.50); g = lerp(g, 217, 0.50); b = lerp(b, 160, 0.55); }
    // speed pushes toward warm white
    var warm = clamp((spd - 1) / 3.0, 0, 1) * 0.5;
    r = lerp(r, 255, warm); g = lerp(g, 244, warm); b = lerp(b, 214, warm);
    out[0] = r; out[1] = g; out[2] = b; out[3] = clamp((0.22 + prox * 1.1) * bright, 0.05, 1);
  }
  var _c = [0, 0, 0, 1];

  // ---- frame ----
  function frame(now) {
    if (!running) return;
    if (!lastT) lastT = now;
    var dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.05) dt = 0.05;
    if (dt <= 0) dt = 0.0001;

    // fps
    fpsAccum += dt; fpsFrames++;
    if (fpsAccum >= 0.25) { fpsShown = Math.round(fpsFrames / fpsAccum); fpsAccum = 0; fpsFrames = 0; }

    // warp easing
    warpBoost *= Math.pow(0.10, dt);
    if (warpBoost < 0.001) warpBoost = 0;
    var target = CRUISE;
    if (spaceDown) target = Math.max(target, WARP_MAX);
    target = clamp(target + warpBoost, CRUISE, WARP_MAX);
    warpTarget = target;
    warp = lerp(warp, warpTarget, 1 - Math.pow(0.0008, dt));

    // camera easing (smooth lerp)
    camX = lerp(camX, camTX, 1 - Math.pow(0.0018, dt));
    camY = lerp(camY, camTY, 1 - Math.pow(0.0018, dt));

    var speed = BASE_SPEED * warp;

    // motion-blur fade (semi-transparent dark overlay, NOT clearRect)
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(5,7,12," + (reduceMotion ? 0.6 : 0.26) + ")";
    ctx.fillRect(0, 0, W, H);

    // additive pass for glowing trails
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";

    // ---- background dust (slow drift, parallax) ----
    var dspeed = speed * DUST_SPEED;
    var dZmax = Z_MAX * 1.8;
    for (var i = 0; i < dust.length; i++) {
      var d = dust[i];
      d.x += d.vx * dt; d.y += d.vy * dt; d.z -= dspeed * dt;
      if (d.z <= Z_NEAR || d.x < -3 || d.x > 3 || d.y < -3 || d.y > 3) {
        var nd = newDust(true);
        d.x = nd.x; d.y = nd.y; d.z = nd.z; d.vx = nd.vx; d.vy = nd.vy;
        continue;
      }
      var sx = projX(d.x, d.z), sy = projY(d.y, d.z);
      if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;
      var dprox = clamp(1 - d.z / dZmax, 0, 1);
      var dr = lerp(90, 160, d.seed), dg = lerp(120, 180, d.seed), db = lerp(190, 220, d.seed);
      ctx.strokeStyle = "rgba(" + (dr|0) + "," + (dg|0) + "," + (db|0) + "," +
                        (0.20 + dprox * 0.12).toFixed(3) + ")";
      ctx.lineWidth = clamp(0.4 + dprox * 1.2, 0.4, 1.4);
      // short radial dust streak
      var ddx = sx - CX, ddy = sy - CY, dd = Math.sqrt(ddx*ddx + ddy*ddy) || 1;
      var dlen = (2 + warp * 4) * (0.4 + dprox);
      ctx.beginPath();
      ctx.moveTo(sx - ddx/dd*dlen, sy - ddy/dd*dlen);
      ctx.lineTo(sx, sy);
      ctx.stroke();
    }

    // ---- foreground stars ----
    for (var j = 0; j < stars.length; j++) {
      var s = stars[j];
      s.z -= speed * dt;
      if (s.z <= Z_NEAR) {
        var nd = newStar(true);
        s.x = nd.x; s.y = nd.y; s.z = nd.z; s.layer = nd.layer; s.hue = nd.hue;
        continue;
      }
      var lay = LAYERS[s.layer];
      var sx2 = projX(s.x, s.z), sy2 = projY(s.y, s.z);
      if (sx2 < -80 || sx2 > W + 80 || sy2 < -80 || sy2 > H + 80) continue;

      var prox = clamp(1 - s.z / Z_MAX, 0, 1);
      starRGB(prox, warp, lay.bright, s.hue, _c);
      ctx.strokeStyle = "rgba(" + (_c[0]|0) + "," + (_c[1]|0) + "," + (_c[2]|0) + "," + _c[3].toFixed(3) + ")";

      // deterministic radial streak: length grows with speed -> warp stretch
      var ox = sx2 - CX, oy = sy2 - CY;
      var dist = Math.sqrt(ox*ox + oy*oy);
      var trailLen = (8 + warp * 12) * lay.trail * (0.5 + prox * 1.5);
      ctx.lineWidth = clamp(lay.size * (0.5 + prox * 1.3), 0.4, 4.5);
      if (dist > 1.5) {
        var ux = ox / dist, uy = oy / dist;
        ctx.beginPath();
        ctx.moveTo(sx2 - ux * trailLen, sy2 - uy * trailLen);
        ctx.lineTo(sx2, sy2);
        ctx.stroke();
      } else {
        // near dead-center: just a dot
        ctx.fillStyle = ctx.strokeStyle;
        ctx.beginPath();
        ctx.arc(sx2, sy2, ctx.lineWidth * 0.6, 0, 6.2832);
        ctx.fill();
      }

      // near/mid glow head (additive sprite, cheap)
      if (lay.glow > 0) {
        var gs = (10 + prox * 26) * lay.glow;
        ctx.globalAlpha = clamp((0.25 + prox * 0.75) * lay.glow, 0, 0.95);
        ctx.drawImage(prox > 0.62 ? glowWarm : glowCool,
                      sx2 - gs * 0.5, sy2 - gs * 0.5, gs, gs);
        ctx.globalAlpha = 1;
      }
    }

    ctx.globalCompositeOperation = "source-over";

    // HUD throttle
    hudTimer += dt;
    if (hudTimer >= 0.12) {
      elFps.textContent = fpsShown;
      elStars.textContent = stars.length;
      elWarp.textContent = "x" + warp.toFixed(1);
      hudTimer = 0;
    }

    rafId = requestAnimationFrame(frame);
  }

  function start() { if (running) return; running = true; lastT = 0; rafId = requestAnimationFrame(frame); }
  function stop() { running = false; if (rafId) cancelAnimationFrame(rafId); rafId = 0; }

  // ---- input: drag to steer (mouse + touch, pointer-capture) ----
  var dragging = false, lastPX = 0, lastPY = 0;
  function getPoint(e) {
    if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }
  function onDown(e) {
    dragging = true;
    var p = getPoint(e); lastPX = p.x; lastPY = p.y;
    elHint.classList.add("hidden");
    if (canvas.setPointerCapture && e.pointerId != null) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
  }
  function onMove(e) {
    if (!dragging) return;
    var p = getPoint(e);
    var dx = p.x - lastPX, dy = p.y - lastPY;
    lastPX = p.x; lastPY = p.y;
    camTX = clamp(camTX - dx * 0.0018, -1.1, 1.1);
    camTY = clamp(camTY - dy * 0.0018, -1.1, 1.1);
  }
  function onUp() { dragging = false; }

  canvas.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);

  // touch: drag steers; long-press (no move) accelerates
  var pressTimer = null, pressMoved = false, touchStartX = 0, touchStartY = 0;
  canvas.addEventListener("touchstart", function (e) {
    var p = getPoint(e);
    touchStartX = p.x; touchStartY = p.y; pressMoved = false;
    onDown(e);
    pressTimer = setTimeout(function () { if (!pressMoved) spaceDown = true; }, 340);
  }, { passive: true });
  canvas.addEventListener("touchmove", function (e) {
    var p = getPoint(e);
    if (Math.abs(p.x - touchStartX) > 8 || Math.abs(p.y - touchStartY) > 8) {
      pressMoved = true;
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
      spaceDown = false;
    }
    onMove(e);
    if (e.cancelable) e.preventDefault();
  }, { passive: false });
  function touchEnd() {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    spaceDown = false;
    onUp();
  }
  canvas.addEventListener("touchend", touchEnd, { passive: true });
  canvas.addEventListener("touchcancel", touchEnd, { passive: true });

  // ---- keyboard ----
  window.addEventListener("keydown", function (e) {
    var code = e.code || "";
    if (code === "Space" || e.key === " ") {
      spaceDown = true;
      e.preventDefault();
      elHint.classList.add("hidden");
    } else if (code === "KeyH" || e.key.toLowerCase() === "h") {
      elHud.classList.toggle("hidden");
    } else if (code === "KeyR" || e.key.toLowerCase() === "r") {
      resetAll();
    }
  });
  window.addEventListener("keyup", function (e) {
    if ((e.code || "") === "Space" || e.key === " ") spaceDown = false;
  });

  // ---- wheel = warp boost ----
  window.addEventListener("wheel", function (e) {
    e.preventDefault();
    var dir = e.deltaY < 0 ? 1 : -1;
    warpBoost = clamp(warpBoost + dir * 0.9, 0, WARP_MAX - CRUISE);
    elHint.classList.add("hidden");
  }, { passive: false });

  function resetAll() {
    camTX = 0; camTY = 0; warpBoost = 0; warp = CRUISE;
    seedStars(); seedDust(); paintBase();
  }

  // ---- visibility ----
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stop(); else start();
  });
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 200); });

  resize();
  rafId = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
